name: Android CI

on:
  push:
  workflow_dispatch:
  pull_request:

env:
  CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}

jobs:
  debug:
    name: Debug APK
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Get LTW
        uses: dawidd6/action-download-artifact@v6
        continue-on-error: true
        with:
          repo: MojoLauncher/LTW
          workflow: android.yml
          workflow_conclusion: success
          name: output-aar
          path: app_pojavlauncher/libs

      - name: Get Mesa
        uses: dawidd6/action-download-artifact@v6
        continue-on-error: true
        with:
          github_token: ${{ secrets.MESA_ACTIONS }}
          repo: MojoLauncher/mesa-unified2
          workflow: android.yml
          workflow_conclusion: success
          branch: mojo/26.2
          name: mesa-aar
          path: app_pojavlauncher/libs

      - name: List renderer libs (sanity check)
        run: ls -la app_pojavlauncher/libs || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build debug APK (full)
        run: gradle :app_pojavlauncher:assembleFullDebug

      - name: Build debug APK (no runtime)
        run: gradle :app_pojavlauncher:assembleNoruntimeDebug

      - name: Collect APKs
        run: |
          mkdir out
          mv app_pojavlauncher/build/outputs/apk/full/debug/app_pojavlauncher-full-debug.apk out/pleiades-debug-full.apk
          mv app_pojavlauncher/build/outputs/apk/noruntime/debug/app_pojavlauncher-noruntime-debug.apk out/pleiades-debug-noruntime.apk
          (cd out && md5sum *.apk > md5sums.txt)

      - name: Upload debug APK (full)
        uses: actions/upload-artifact@v4
        with:
          name: pleiades-debug-full
          path: out/pleiades-debug-full.apk

      - name: Upload debug APK (no runtime)
        uses: actions/upload-artifact@v4
        with:
          name: pleiades-debug-noruntime
          path: out/pleiades-debug-noruntime.apk

  tests:
    name: Unit tests and compile checks
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Unit tests
        run: gradle :app_pojavlauncher:testFullDebugUnitTest

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app_pojavlauncher/build/reports/tests/
          if-no-files-found: ignore

  release:
    name: Release APK
    # Manual runs and version tags only.
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    env:
      PLEIADES_KEYSTORE_PASSWORD: ${{ secrets.PLEIADES_KEYSTORE_PASSWORD }}
      PLEIADES_KEY_ALIAS: ${{ secrets.PLEIADES_KEY_ALIAS }}
      PLEIADES_KEY_PASSWORD: ${{ secrets.PLEIADES_KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Get LTW
        uses: dawidd6/action-download-artifact@v6
        continue-on-error: true
        with:
          repo: MojoLauncher/LTW
          workflow: android.yml
          workflow_conclusion: success
          name: output-aar
          path: app_pojavlauncher/libs

      - name: Get Mesa
        uses: dawidd6/action-download-artifact@v6
        continue-on-error: true
        with:
          github_token: ${{ secrets.MESA_ACTIONS }}
          repo: MojoLauncher/mesa-unified2
          workflow: android.yml
          workflow_conclusion: success
          branch: mojo/26.2
          name: mesa-aar
          path: app_pojavlauncher/libs

      - name: Decode release keystore
        id: keystore
        env:
          KEYSTORE_B64: ${{ secrets.PLEIADES_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "PLEIADES_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::PLEIADES_KEYSTORE_BASE64 secret missing - APK will use the DEBUG key. Do not publish."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build release APK
        run: gradle :app_pojavlauncher:assembleFullRelease

      - name: Collect APK
        run: |
          mkdir out
          mv app_pojavlauncher/build/outputs/apk/full/release/app_pojavlauncher-full-release.apk out/pleiades-release.apk
          md5sum out/pleiades-release.apk > out/pleiades-release.md5

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.keystore.outputs.signed == 'true' && 'pleiades-release' || 'pleiades-release-DEBUGKEY-DO-NOT-PUBLISH' }}
          path: out/
